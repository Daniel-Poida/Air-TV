name: Generate APK

env:
  main_project_module: app

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Сборка ничего не публикует: релизы собираются и проверяются на реальных
# телевизорах вручную. Права токену нужны только на чтение исходников.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use JDK
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      # Нативная часть собирается из исходников вместе с FFmpeg и OpenSSL:
      # в этом и смысл проверки, поэтому prebuiltNative здесь не включается.
      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease lintRelease --stacktrace

      # APK и AAB остаются в артефактах запуска. Ключа подписи в репозитории
      # нет, поэтому сборка без подписи — для проверки, а не для установки.
      - name: Upload unsigned build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: airtv-unsigned-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.main_project_module }}/build/outputs/apk/release/*.apk
            ${{ env.main_project_module }}/build/outputs/bundle/release/*.aab
            ${{ env.main_project_module }}/build/reports/lint-results-release.html
